<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NationPeek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Custom Tailwind Configuration */
        @layer base {
            :root {
                --color-primary: 66, 125, 234;
                --color-secondary: 118, 75, 162;
                --bg-light-start: 227, 242, 253;
                --bg-light-end: 144, 202, 249;
                --bg-dark-start: 26, 26, 46;
                --bg-dark-end: 15, 52, 96;
            }
        }
        
        .glass-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] .glass-card {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-bg {
            background-image: linear-gradient(135deg, rgb(var(--color-primary)) 0%, rgb(var(--color-secondary)) 100%);
        }
        
        .hero-title-gradient {
            background-image: linear-gradient(135deg, rgb(var(--color-primary)) 0%, rgb(var(--color-secondary)) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .temp-gradient {
            background-image: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background-attachment: fixed;
            min-height: 100vh;
            background-image: linear-gradient(135deg, rgb(var(--bg-light-start)) 0%, rgb(var(--bg-light-end)) 100%);
        }

        [data-theme="dark"] body {
            background-image: linear-gradient(135deg, rgb(var(--bg-dark-start)) 0%, rgb(var(--bg-dark-end)) 100%);
        }
    </style>
</head>

<body data-theme="light" class="text-gray-900 antialiased">
    <button class="fixed top-5 right-5 z-50 rounded-full bg-white/70 backdrop-blur-md shadow-lg p-3 text-gray-700 transition duration-300 hover:bg-white focus:outline-none" onclick="toggleTheme()">
        <i id="themeIcon" class="fas fa-moon"></i>
    </button>

    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-gray-800/80 glass-card p-8 rounded-xl shadow-2xl text-white text-center">
            <div class="animate-spin w-8 h-8 border-4 border-white border-t-transparent rounded-full mb-4 mx-auto"></div>
            <h5 id="loadingText" class="text-lg font-semibold">Loading...</h5>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 md:py-12 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-extrabold hero-title-gradient mb-3 tracking-tight md:text-6xl">
                <i class="fas fa-globe-americas"></i> NationPeek
            </h1>
            <p class="text-xl text-gray-700 dark:text-gray-300">Discover countries and their capital city weather</p>
        </div>

        <div class="max-w-xl mx-auto mb-10">
            <div class="glass-card p-6 rounded-2xl">
                <form id="searchForm" onsubmit="searchCountry(event)">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="flex-grow">
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input 
                                    type="text" 
                                    class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 dark:bg-gray-700 dark:text-gray-100" 
                                    id="countryInput" 
                                    placeholder="Enter country name..."
                                    required
                                >
                            </div>
                        </div>
                        <button type="submit" class="gradient-bg text-white font-semibold py-3 px-6 rounded-full shadow-lg hover:shadow-xl transition duration-300 hover:scale-[1.02] active:scale-[0.98]" id="searchBtn">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <button type="button" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-full shadow-md transition duration-300" onclick="getCurrentLocation()">
                        <i class="fas fa-map-marker-alt"></i> Use My Location
                    </button>
                </div>
            </div>
        </div>

        <div id="alertContainer" class="mb-4"></div>

        <div id="resultSection" class="hidden">
            <div class="glass-card p-6 md:p-8 mb-6 rounded-2xl shadow-xl">
                <div class="flex items-center space-x-4">
                    <div id="countryFlag" class="text-6xl md:text-8xl leading-none"></div>
                    <div>
                        <h2 id="countryName" class="text-3xl md:text-4xl font-bold mb-1 dark:text-white"></h2>
                        <p id="countryCapital" class="text-lg md:text-xl text-gray-600 dark:text-gray-400">
                            <i class="fas fa-map-pin mr-2"></i> Capital: <span class="font-semibold"></span>
                        </p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="stat-card p-4 rounded-xl shadow-md transition hover:shadow-lg">
                    <div class="text-3xl mb-2 text-indigo-500"><i class="fas fa-users"></i></div>
                    <h5 class="text-sm font-medium uppercase text-gray-500 dark:text-gray-400">Population</h5>
                    <p id="countryPopulation" class="text-xl font-bold text-blue-600 dark:text-blue-400 mt-1">--</p>
                </div>
                
                <div class="stat-card p-4 rounded-xl shadow-md transition hover:shadow-lg">
                    <div class="text-3xl mb-2 text-green-500"><i class="fas fa-globe"></i></div>
                    <h5 class="text-sm font-medium uppercase text-gray-500 dark:text-gray-400">Region</h5>
                    <p id="countryRegion" class="text-lg font-bold text-green-600 dark:text-green-400 mt-1">--</p>
                </div>
                
                <div class="stat-card p-4 rounded-xl shadow-md transition hover:shadow-lg">
                    <div class="text-3xl mb-2 text-yellow-500"><i class="fas fa-expand-arrows-alt"></i></div>
                    <h5 class="text-sm font-medium uppercase text-gray-500 dark:text-gray-400">Area</h5>
                    <p id="countryArea" class="text-lg font-bold text-yellow-600 dark:text-yellow-400 mt-1">--</p>
                </div>
                
                <div class="stat-card p-4 rounded-xl shadow-md transition hover:shadow-lg">
                    <div class="text-3xl mb-2 text-red-500"><i class="fas fa-clock"></i></div>
                    <h5 class="text-sm font-medium uppercase text-gray-500 dark:text-gray-400">Local Time</h5>
                    <div id="localTime" class="text-2xl font-bold text-red-600 dark:text-red-400">--:--</div>
                    <div id="timezone" class="text-xs opacity-75 mt-1"></div>
                </div>
            </div>

            <div class="glass-card p-6 md:p-8 rounded-2xl shadow-xl">
                <h3 class="text-2xl font-semibold mb-4 text-gray-800 dark:text-white">
                    <i class="fas fa-cloud-sun text-blue-500 mr-2"></i> 
                    Current Weather in <span id="weatherCity" class="font-bold"></span>
                </h3>
                <div id="weatherContent" class="flex flex-wrap items-center gap-6">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            REQUEST_TIMEOUT: 10000,
            ENDPOINTS: {
                // Switched to Open-Meteo (No API Key Required)
                WEATHER: 'https://api.open-meteo.com/v1/forecast',
                COUNTRIES: 'https://restcountries.com/v3.1',
                GEOCODING: 'https://api.bigdatacloud.net/data/reverse-geocode-client'
            }
        };

        // --- Global State ---
        let timeInterval = null;

        // --- Theme & UI Functions ---
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeIcon').className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            document.body.classList.toggle('text-gray-900', newTheme === 'light');
            document.body.classList.toggle('dark:text-white', newTheme === 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            if (savedTheme === 'dark') {
                document.body.classList.remove('text-gray-900');
                document.body.classList.add('dark:text-white');
            }
        }

        function showLoading(text = 'Loading...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.body.style.overflow = '';
        } 

        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            const color = type === 'danger' ? 'red' : (type === 'warning' ? 'yellow' : 'blue');
            const icon = type === 'danger' ? 'fa-exclamation-triangle' : (type === 'warning' ? 'fa-exclamation-circle' : 'fa-info-circle');
            
            const alertHTML = `
                <div class="p-4 mb-4 text-sm text-${color}-800 rounded-lg bg-${color}-100 dark:bg-${color}-200 dark:text-${color}-800 flex items-center shadow" role="alert">
                    <i class="fas ${icon} mr-3"></i>
                    <div>${message}</div>
                    <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-transparent text-${color}-500 rounded-lg p-1.5 hover:bg-${color}-200 inline-flex items-center justify-center h-8 w-8" onclick="this.closest('div').remove()">
                        <span class="sr-only">Close alert</span>
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            alertContainer.innerHTML = alertHTML;
            setTimeout(() => { const el = alertContainer.querySelector('div'); if (el) el.remove(); }, 5000);
        }

        function formatNumber(number) { return number.toLocaleString('en-US'); }
        function formatPopulation(population) {
            if (population >= 1000000) return (population / 1000000).toFixed(1) + 'M';
            if (population >= 1000) return (population / 1000).toFixed(1) + 'K';
            return formatNumber(population);
        }
        function formatArea(area) { return formatNumber(area) + ' km²'; }

        // --- Data Fetching ---

        async function fetchCountryData(countryName) {
            const response = await fetch(`${CONFIG.ENDPOINTS.COUNTRIES}/name/${encodeURIComponent(countryName)}?fullText=true`);
            if (!response.ok) throw new Error(response.status === 404 ? 'Country not found.' : 'Failed to fetch country data.');
            const data = await response.json();
            const country = data[0];
            return {
                name: country.name.common,
                capital: country.capital ? country.capital[0] : 'N/A',
                population: country.population,
                region: country.region,
                subregion: country.subregion,
                area: country.area,
                flag: country.flag,
                timezones: country.timezones,
                latlng: country.latlng,
                capitalInfo: country.capitalInfo // Contains latlng for capital
            };
        }

        // Updated to use Open-Meteo (No API Key)
        async function fetchWeatherData(lat, lon) {
            try {
                // Fetch current weather, humidity, and wind speed
                const response = await fetch(
                    `${CONFIG.ENDPOINTS.WEATHER}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&timezone=auto`
                );
                
                if (!response.ok) throw new Error('Weather data not found');
                const data = await response.json();
                const current = data.current;

                return {
                    temp: current.temperature_2m,
                    feels_like: current.apparent_temperature,
                    humidity: current.relative_humidity_2m,
                    wind_speed: current.wind_speed_10m,
                    weather_code: current.weather_code,
                    is_day: current.is_day
                };
            } catch (error) {
                console.error(error);
                throw new Error('Failed to fetch weather data.');
            }
        }

        // --- Helper: WMO Weather Code to Description & Icon ---
        function getWeatherDetails(code, isDay) {
            // WMO Weather interpretation codes (WW)
            const codes = {
                0: { desc: 'Clear sky', icon: isDay ? 'fa-sun' : 'fa-moon' },
                1: { desc: 'Mainly clear', icon: isDay ? 'fa-cloud-sun' : 'fa-cloud-moon' },
                2: { desc: 'Partly cloudy', icon: 'fa-cloud' },
                3: { desc: 'Overcast', icon: 'fa-cloud' },
                45: { desc: 'Fog', icon: 'fa-smog' },
                48: { desc: 'Depositing rime fog', icon: 'fa-smog' },
                51: { desc: 'Light drizzle', icon: 'fa-cloud-rain' },
                53: { desc: 'Moderate drizzle', icon: 'fa-cloud-rain' },
                55: { desc: 'Dense drizzle', icon: 'fa-cloud-showers-heavy' },
                61: { desc: 'Slight rain', icon: 'fa-cloud-rain' },
                63: { desc: 'Moderate rain', icon: 'fa-cloud-showers-heavy' },
                65: { desc: 'Heavy rain', icon: 'fa-cloud-showers-heavy' },
                71: { desc: 'Slight snow', icon: 'fa-snowflake' },
                73: { desc: 'Moderate snow', icon: 'fa-snowflake' },
                75: { desc: 'Heavy snow', icon: 'fa-snowflake' },
                77: { desc: 'Snow grains', icon: 'fa-snowflake' },
                80: { desc: 'Slight rain showers', icon: 'fa-cloud-rain' },
                81: { desc: 'Moderate rain showers', icon: 'fa-cloud-showers-heavy' },
                82: { desc: 'Violent rain showers', icon: 'fa-cloud-showers-heavy' },
                95: { desc: 'Thunderstorm', icon: 'fa-bolt' },
                96: { desc: 'Thunderstorm with hail', icon: 'fa-bolt' },
                99: { desc: 'Thunderstorm with heavy hail', icon: 'fa-bolt' }
            };
            return codes[code] || { desc: 'Unknown', icon: 'fa-question-circle' };
        }

        // --- Time Handling Fix ---
        function calculateLocalTime(offsetStr) {
            // Handles "UTC+05:30", "UTC-04:00", or "UTC"
            if (!offsetStr || offsetStr === 'UTC') {
                return new Date().toLocaleTimeString('en-US', { timeZone: 'UTC', hour: 'numeric', minute: 'numeric', hour12: true });
            }

            // Parse offset
            const operator = offsetStr.includes('-') ? -1 : 1;
            const cleanStr = offsetStr.replace('UTC', '').replace('+', '').replace('-', '');
            const parts = cleanStr.split(':');
            const hours = parseInt(parts[0], 10);
            const minutes = parts.length > 1 ? parseInt(parts[1], 10) : 0;
            
            const offsetMs = operator * ((hours * 60) + minutes) * 60000;
            
            // Calculate target time:
            // We create a Date object that, when printed in the USER'S local time,
            // actually displays the time at the target location.
            // Logic: TargetTime = UTC + TargetOffset
            // Browser displays: UTC + LocalOffset
            // We want Browser Display = TargetTime
            // So we construct a date D where D_UTC + LocalOffset = UTC_Real + TargetOffset
            // D_UTC = UTC_Real + TargetOffset - LocalOffset
            // Note: getTimezoneOffset() returns -(LocalOffset) in minutes.
            
            const now = new Date();
            const utc = now.getTime(); // This is UTC_Real
            const localOffsetMs = now.getTimezoneOffset() * 60000 * -1; // Convert to MS, invert sign for correct logic
            
            // Wait, standard trick is easier:
            // new Date( now.getTime() + targetOffsetMs + (now.getTimezoneOffset() * 60000) )
            // Because getTimezoneOffset() is positive if local is BEHIND UTC.
            
            const targetTime = new Date(now.getTime() + offsetMs + (now.getTimezoneOffset() * 60000));
            return targetTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
        }

        function updateTimeDisplay(timezoneOffset) {
            if (timeInterval) clearInterval(timeInterval);
            
            function update() {
                try {
                    const timeStr = calculateLocalTime(timezoneOffset);
                    document.getElementById('localTime').textContent = timeStr;
                    document.getElementById('timezone').textContent = timezoneOffset;
                } catch (e) {
                    document.getElementById('localTime').textContent = '--:--';
                }
            }
            update();
            timeInterval = setInterval(update, 1000); // Update every second
        }

        // --- Display Logic ---

        function displayResult(countryData, weatherData) {
            // Basic Info
            document.getElementById('countryFlag').textContent = countryData.flag;
            document.getElementById('countryName').textContent = countryData.name;
            document.getElementById('countryCapital').querySelector('span').textContent = countryData.capital;
            
            // Stats
            document.getElementById('countryPopulation').textContent = formatPopulation(countryData.population);
            document.getElementById('countryRegion').textContent = countryData.region + (countryData.subregion ? ` (${countryData.subregion})` : '');
            document.getElementById('countryArea').textContent = formatArea(countryData.area);
            
            // Time (Fix: Use Offset string directly)
            if (countryData.timezones && countryData.timezones.length > 0) {
                updateTimeDisplay(countryData.timezones[0]);
            } else {
                document.getElementById('localTime').textContent = 'N/A';
            }
            
            // Weather
            const weatherContent = document.getElementById('weatherContent');
            document.getElementById('weatherCity').textContent = countryData.capital;

            if (weatherData) {
                const weatherInfo = getWeatherDetails(weatherData.weather_code, weatherData.is_day);
                
                weatherContent.innerHTML = `
                    <div class="flex items-center">
                        <div class="text-6xl mr-4 text-blue-400 drop-shadow-lg">
                             <i class="fas ${weatherInfo.icon}"></i>
                        </div>
                        <div>
                            <div id="temperature" class="text-5xl font-extrabold temp-gradient">${Math.round(weatherData.temp)}°C</div>
                            <div class="text-xl capitalize text-gray-700 dark:text-gray-300">${weatherInfo.desc}</div>
                        </div>
                    </div>

                    <div class="flex-grow grid grid-cols-3 gap-4 text-center">
                        <div>
                            <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Feels Like</div>
                            <div class="text-lg font-bold text-gray-800 dark:text-white mt-1">${Math.round(weatherData.feels_like)}°C</div>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Humidity</div>
                            <div class="text-lg font-bold text-gray-800 dark:text-white mt-1">${weatherData.humidity}%</div>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Wind Speed</div>
                            <div class="text-lg font-bold text-gray-800 dark:text-white mt-1">${weatherData.wind_speed} km/h</div>
                        </div>
                    </div>
                `;
            } else {
                weatherContent.innerHTML = '<div class="w-full text-center text-gray-500">Weather data unavailable for this location.</div>';
            }
            
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        // --- Main Actions ---

        async function searchCountry(event) {
            event.preventDefault();
            const countryName = document.getElementById('countryInput').value.trim();
            if (!countryName) return;
            
            const searchBtn = document.getElementById('searchBtn');
            
            try {
                searchBtn.disabled = true;
                searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
                showLoading('Searching for country...');
                document.getElementById('resultSection').classList.add('hidden');
                document.getElementById('alertContainer').innerHTML = '';
                
                // 1. Fetch Country
                const countryData = await fetchCountryData(countryName);
                
                // 2. Fetch Weather (using Lat/Lon from capital or country)
                let weatherData = null;
                if (countryData.capital !== 'N/A') {
                    showLoading(`Getting weather for ${countryData.capital}...`);
                    try {
                        // Use Capital Info latlng if available, else Country latlng
                        const [lat, lon] = (countryData.capitalInfo && countryData.capitalInfo.latlng) 
                            ? countryData.capitalInfo.latlng 
                            : countryData.latlng;
                            
                        if (lat && lon) {
                            weatherData = await fetchWeatherData(lat, lon);
                        }
                    } catch (wErr) {
                        console.warn('Weather fetch error:', wErr);
                    }
                }
                
                displayResult(countryData, weatherData);
                
            } catch (error) {
                showAlert(error.message);
            } finally {
                // FIX: Explicitly reset button state to avoid sticking
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search"></i> Search';
                hideLoading();
            }
        }

        async function getCurrentLocation() {
            if (!navigator.geolocation) {
                showAlert('Geolocation is not supported by this browser.', 'danger');
                return;
            }

            const locationBtn = document.querySelector('[onclick="getCurrentLocation()"]');
            
            try {
                locationBtn.disabled = true;
                locationBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting Location...';
                showLoading('Getting your location...');
                
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            const { latitude, longitude } = position.coords;
                            
                            showLoading('Finding your country...');
                            const response = await fetch(`${CONFIG.ENDPOINTS.GEOCODING}?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
                            if (!response.ok) throw new Error('Location lookup failed');
                            const locData = await response.json();
                            
                            if (!locData.countryName) throw new Error('Country not found');
                            
                            document.getElementById('countryInput').value = locData.countryName;
                            
                            // Reuse search logic mostly, but we are already here
                            const countryData = await fetchCountryData(locData.countryName);
                            
                            let weatherData = null;
                            if (countryData.capital !== 'N/A') {
                                showLoading(`Getting weather for ${countryData.capital}...`);
                                try {
                                    const [lat, lon] = (countryData.capitalInfo && countryData.capitalInfo.latlng) ? countryData.capitalInfo.latlng : countryData.latlng;
                                    if(lat && lon) weatherData = await fetchWeatherData(lat, lon);
                                } catch(e) {}
                            }
                            
                            displayResult(countryData, weatherData);
                        } catch (err) {
                            showAlert(err.message, 'danger');
                        } finally {
                            // FIX: Explicit reset
                            locationBtn.disabled = false;
                            locationBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Use My Location';
                            hideLoading();
                        }
                    },
                    (error) => {
                        locationBtn.disabled = false;
                        locationBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Use My Location';
                        hideLoading();
                        showAlert('Location access denied or unavailable.', 'danger');
                    }
                );
            } catch (error) {
                locationBtn.disabled = false;
                locationBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Use My Location';
                hideLoading();
                showAlert(error.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', initTheme);
        window.addEventListener('beforeunload', () => { if (timeInterval) clearInterval(timeInterval); });
    </script>
</body>
</html>
